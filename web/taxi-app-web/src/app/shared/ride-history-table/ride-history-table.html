<div class="ride-history-container">

    <div class="filter-container">
        <mat-form-field appearance="fill" class="filter-input">
            <input type="text" [(ngModel)]="textFilter" matInput placeholder="Search">
        </mat-form-field>

        <mat-form-field appearance="fill" class="filter-input">
            <input matInput [matDatepicker]="from" [(ngModel)]="fromDateFilter" placeholder="From">
            <mat-datepicker-toggle matSuffix [for]="from"></mat-datepicker-toggle>
            <mat-datepicker #from></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill" class="filter-input">
            <input matInput [matDatepicker]="to" [(ngModel)]="toDateFilter" placeholder="To">
            <mat-datepicker-toggle matSuffix [for]="to"></mat-datepicker-toggle>
            <mat-datepicker #to></mat-datepicker>
        </mat-form-field>

        <button mat-raised-button id="apply-btn" (click)="applyFilters()">
            Apply
        </button>

        <button mat-stroked-button id="clear-btn" (click)="clearFilters()">
            Clear
        </button>
    </div>
        
    <table mat-table [dataSource]="filteredRides" class="mat-elevation-z2">

  <!-- Pickup -->
  <ng-container matColumnDef="pickup">
    <th mat-header-cell *matHeaderCellDef> Pickup </th>
    <td mat-cell *matCellDef="let ride">
      {{ getPickup(ride) }}
    </td>
  </ng-container>

  <!-- Destination -->
  <ng-container matColumnDef="destination">
    <th mat-header-cell *matHeaderCellDef> Destination </th>
    <td mat-cell *matCellDef="let ride">
      {{ getDestination(ride) }}
    </td>
  </ng-container>

  <!-- Date -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let ride">
      {{ getDate(ride) }}
    </td>
  </ng-container>

  <!-- Start Time -->
  <ng-container matColumnDef="startTime">
    <th mat-header-cell *matHeaderCellDef> Start Time </th>
    <td mat-cell *matCellDef="let ride">
      {{ getStartTime(ride) }}
    </td>
  </ng-container>

  <!-- End Time -->
  <ng-container matColumnDef="endTime">
    <th mat-header-cell *matHeaderCellDef> End Time </th>
    <td mat-cell *matCellDef="let ride">
      {{ getEndTime(ride) }}
    </td>
  </ng-container>

  <!-- Price -->
  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> Price </th>
    <td mat-cell *matCellDef="let ride">
      {{ ride.price }} RSD
    </td>
  </ng-container>

  <!-- Panic -->
  <ng-container matColumnDef="panic">
    <th mat-header-cell *matHeaderCellDef> Panic </th>
    <td mat-cell *matCellDef="let ride">
      {{ ride.panic ? 'YES' : 'NO' }}
    </td>
  </ng-container>

  <!-- Details -->
  <ng-container matColumnDef="details">
    <th mat-header-cell *matHeaderCellDef> Details </th>
    <td mat-cell *matCellDef="let ride">
      <button
        class="details-link"
        (click)="viewDetails(ride)">
        View
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

</div>
