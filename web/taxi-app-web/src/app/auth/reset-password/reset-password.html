<div class="reset-password-page">
  <div class="reset-password-container">
    <h2>Reset your password</h2>

    <form (ngSubmit)="resetPassword()" #resetForm="ngForm">
      <input 
        type="password" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="New password" 
        required
        [disabled]="isLoading"
      >
      <input 
        type="password" 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword" 
        placeholder="Confirm password" 
        required
        [disabled]="isLoading"
      >

      <!-- Loading indicator -->
      <div *ngIf="isLoading" class="loading">
        Resetting password...
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage && !isLoading" class="error">
        {{ errorMessage }}
      </div>

      <!-- Success message -->
      <div *ngIf="successMessage && !isLoading" class="success">
        {{ successMessage }}
      </div>

      <div class="buttons">
        <button 
          type="submit" 
          [disabled]="isLoading || !password || !confirmPassword"
        >
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </div>
    </form>

  </div>
</div>
