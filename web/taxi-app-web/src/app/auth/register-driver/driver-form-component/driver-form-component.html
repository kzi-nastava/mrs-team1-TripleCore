<div class="registration-container registration-card p-4 mx-auto">
  <h2 class="text-center purple-text fw-bold mt-2">Register Driver</h2>
  <p class="text-center purple-text small fw-bold mb-4">Driver info</p>

  <form [formGroup]="form">
    <div class="row justify-content-center">
      
      <div class="col-md-3 d-flex flex-column align-items-center pt-3">
        <div class="profile-photo-placeholder mb-2 shadow-sm">
          <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" class="profile-img">
        </div>
        <span class="purple-text fw-bold small">Photo</span>
      </div>

      <div class="col-md-8">
        <input class="custom-input mb-3" placeholder="First name" formControlName="firstName">
        <input class="custom-input mb-3" placeholder="Last name" formControlName="lastName">
        <input class="custom-input mb-3" placeholder="Address" formControlName="address">
        <input class="custom-input mb-4" placeholder="Phone" formControlName="phone">
        
        <hr class="divider mb-4">

        <input class="custom-input mb-3" placeholder="Email" formControlName="email">
        <!-- <input type="password" class="custom-input mb-3" placeholder="Password" formControlName="password">
        <input type="password" class="custom-input mb-4" placeholder="Confirm password" formControlName="confirmPassword"> -->
        
        <div class="d-flex justify-content-end gap-3 mt-2">
          <button type="button" class="btn btn-cancel rounded-pill px-4" routerLink="/admin-home">Cancel</button>
          <button type="button" class="btn btn-next rounded-pill px-5" (click)="onNext()" [disabled]="form.invalid">
            Next
          </button>
        </div>
      </div>

    </div>
  </form>
</div>
