<div class="page-backdrop">
  <div class="forgot-container">

    <div class="icon-circle">
      !
    </div>

    <h2>Forgot password</h2>
    <p class="subtitle">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <input
      type="email"
      placeholder="john@example.com"
      [(ngModel)]="email"
      name="email"
      [disabled]="isLoading"
    />

    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="loading">
      Sending reset link...
    </div>

    <!-- Error message -->
    <p class="error" *ngIf="error && !isLoading">
      {{ error }}
    </p>

    <!-- Success message -->
    <p class="success" *ngIf="successMessage && !isLoading">
      {{ successMessage }}
    </p>

    <button 
      (click)="sendResetLink()" 
      [disabled]="isLoading"
    >
      {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
    </button>

    <a class="back-link" routerLink="/login">
      ← Back to Login
    </a>

  </div>
</div>
