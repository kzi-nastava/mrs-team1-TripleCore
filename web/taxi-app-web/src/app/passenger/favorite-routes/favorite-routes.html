<app-navbar>
  <li class="nav-item">
        <a class="img-and-link" routerLink="/passenger-my-rides">
            <span class="nav-link">My Rides</span>
        </a>
    </li>

    <li class="nav-item">
    <a class="img-and-link" routerLink="/passenger-reviews">
        <span class="nav-link">My Reviews</span>
    </a>
  </li>

    <li class="nav-item">
        <a class="img-and-link" routerLink="/favorite-routes">
            <span class="nav-link">Favorite Routes</span>
        </a>
    </li>

  <a class="nav-link img-and-link" routerLink="/user-info" matTooltip="My Profile">
    <img src="icons/icons8-test-account-48.png" class="nav-item-icon">
  </a>

  <li class="nav-item">
    <button class="nav-link nav-btn" (click)="onLogoutClick()">Log out</button>
  </li>

  <a class="nav-link img-and-link" routerLink="/home" matTooltip="Live Chat">
    <img src="icons/icons8-chat-48.png" class="nav-item-icon">
  </a>
</app-navbar>

<div class="favorite-routes-container">
  <h2 class="section-title">Favorite routes</h2>
  
  <div class="routes-grid">
    <div class="route-card" *ngFor="let route of favoriteRoutes">
      <h3 class="route-header">{{ route.startAddress }} - {{ route.endAddress }}</h3>
   
      <div class="route-details">
        <div class="detail-item">
          <img src="icons/icons8-address-80.png" class="route-icon" alt="Start Point">
          <span><strong>Start Point:</strong> {{ route.startAddress }}</span>
        </div>
        
        <div class="detail-item">
          <img src="icons/icons8-destination-40.png" class="route-icon" alt="Destination">
          <span><strong>Destination Point:</strong> {{ route.endAddress }}</span>
        </div>
      
      </div>
      
      <div class="card-action">
        <button class="btn-select-route" (click)="orderRideFromFavorite(route)">Select Route</button>
          <button class="btn-remove-favorite" (click)="removeFavoriteRoute(route)">Remove</button>
      </div>
    </div>
  </div>
</div>
