<li class="notifications-dropdown">
  <a class="nav-link img-and-link" style="cursor:pointer;" (click)="onToggleDropdown()">
    Notifications
    <span *ngIf="activeCount > 0" class="notification-badge">{{activeCount}}</span>
  </a>

  <div class="dropdown-content" *ngIf="showDropdown">
    <div class="dropdown-header">
      <h6>🚨 PANIC Alerts</h6>
      <div class="resolved-toggle">
        <button class="btn-toggle" [class.active]="!showResolved" (click)="onToggleResolvedView()">Active ({{activeCount}})</button>
        <button class="btn-toggle" [class.active]="showResolved" (click)="onToggleResolvedView()">Resolved ({{resolvedCount}})</button>
      </div>
    </div>

    <div *ngIf="getFilteredAlerts().length === 0" class="no-alerts">
      <p *ngIf="!showResolved">No active panic alerts</p>
      <p *ngIf="showResolved">No resolved panic alerts</p>
      <small>All clear! 🟢</small>
    </div>

    <app-panic-notification-item
      *ngFor="let alert of getFilteredAlerts()"
      [alert]="alert"
      (markAsResolved)="onMarkAsResolved($event)"
      (viewDetails)="onViewDetails($event)">
    </app-panic-notification-item>

    <div class="dropdown-footer">
      <span class="stats">Total: {{alerts.length}} | Active: {{activeCount}} | Resolved: {{resolvedCount}}</span>
      <a routerLink="/admin/panic-notifications" (click)="toggleDropdown.emit()">See all →</a>
    </div>
  </div>
</li>
