<div class="login-backdrop">
  <div class="login-container estimate-route-container">
    <h2>Estimate Route</h2>

    <form (ngSubmit)="estimateRoute()">
      <input
        type="text"
        placeholder="Start point"
        [(ngModel)]="startQuery"
        name="startQuery"
        (input)="searchStart()"
        autocomplete="off"
        required
        [disabled]="isLoading"
      >

      <ul class="results" *ngIf="startResults.length">
        <li *ngFor="let place of startResults"
            (click)="selectStart(place)">
          {{ place.display_name }}
        </li>
      </ul>

      <input
        type="text"
        placeholder="Destination point"
        [(ngModel)]="destinationQuery"
        name="destinationQuery"
        (input)="searchDestination()"
        autocomplete="off"
        required
        [disabled]="isLoading"
      >

      <ul class="results" *ngIf="destinationResults.length">
        <li *ngFor="let place of destinationResults"
            (click)="selectDestination(place)">
          {{ place.display_name }}
        </li>
      </ul>

      <button type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Estimate</span>
        <span *ngIf="isLoading">Calculating...</span>
      </button>
    </form>

    <!-- Loading spinner -->
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner"></div>
      <p>Calculating route...</p>
    </div>
  </div>
</div>
