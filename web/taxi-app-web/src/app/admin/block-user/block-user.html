<div class="admin-home-container">
  <app-navbar>
    <li class="nav-item">
      <a class="nav-link img-and-link" routerLink="/admin-ride-history">
        Ride history
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link img-and-link" routerLink="/change-profile-request">
        Change Profile Requests
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link img-and-link" routerLink="/admin-home">
        Dashboard
      </a>
    </li>
  
  <li class="nav-item">
    <a class="nav-link img-and-link" routerLink="/register-driver">
      Register Driver
    </a>
  </li>

  <li class="nav-item">
    <a class="nav-link" routerLink="/admin-pricing">
      Pricing
    </a>
  </li>

  <li class="nav-item">
    <a class="nav-link selected-nav-link" routerLink="/admin/block-user">
      Block User
    </a>
  </li>

  <!-- Panic Notifications Component -->
    <app-panic-notifications
      [alerts]="panicAlerts"  
      [showDropdown]="showNotifications"
      [showResolved]="showResolvedAlerts"
      (toggleDropdown)="showNotifications = !showNotifications"
      (markAsResolved)="onMarkAsResolved($event)"
      (viewDetails)="onViewDetails($event)"
      (toggleResolvedView)="onToggleResolvedView($event)">
    </app-panic-notifications>

    <!-- Profile -->
    <a class="nav-link img-and-link" routerLink="/user-info" matTooltip="My Profile">
      <img src="icons/icons8-test-account-48.png" class="nav-item-icon">
    </a>

    <!-- Logout -->
    <li class="nav-item">
      <button class="nav-link nav-btn" (click)="onLogoutClick()">Log out</button>
    </li>

    <!-- Chat -->
    <button 
    class="nav-link img-and-link"  
    matTooltip="Live Chat"
    (click)="openChat()">
      <img src="icons/icons8-chat-48.png" class="nav-item-icon">
    </button>

    <app-admin-chat
      *ngIf="chatOpened"
      (close)="closeChat()">
    </app-admin-chat>

    <!-- Sound Toggle -->
    <li class="nav-item">
      <button class="nav-link img-and-link sound-toggle" 
              [class.muted]="isSoundMuted()"
              (click)="toggleSound()" 
              matTooltip="{{isSoundMuted() ? 'Sound OFF' : 'Sound ON'}}">
        {{isSoundMuted() ? '🔇' : '🔊'}}
      </button>
    </li>
  </app-navbar>

  <div class="block-user-container">
  <h2>Block Users</h2>

  <div class="user-card" *ngFor="let user of users">
    <div class="user-info">
      <p><strong>{{ user.firstname }} {{ user.lastname }}</strong></p>
      <p>{{ user.email }}</p>
      <p>Status: <span [class.blocked]="user.blocked">{{ user.blocked ? 'Blocked' : 'Active' }}</span></p>
    </div>

    <div class="block-action">
      <textarea
        placeholder="Reason for blocking (optional)"
        [(ngModel)]="blockNotes[user.id]"
        class="reason-input"
        [disabled]="user.blocked">
      </textarea>

      <button 
        *ngIf="!user.blocked"
        (click)="blockUser(user)"
        class="block-btn">
        Block
      </button>

      <span *ngIf="user.blocked" class="already-blocked">
        Already blocked
      </span>
    </div>
  </div>
</div>


</div>
