<div class="price-form-container">
  <h2>Change Price List</h2>

  <form (ngSubmit)="submit()" #priceForm="ngForm">

    <div class="price-row">
      <label for="standard">Standard vehicle</label>
      <input
        type="number"
        id="standard"
        name="standard"
        [(ngModel)]="prices.standard"
        min="0"
        step="0.01"
        required
      />
    </div>

    <div class="price-row">
      <label for="van">Van vehicle</label>
      <input
        type="number"
        id="van"
        name="van"
        [(ngModel)]="prices.van"
        min="0"
        step="0.01"
        required
      />
    </div>

    <div class="price-row">
      <label for="luxury">Luxury vehicle</label>
      <input
        type="number"
        id="luxury"
        name="luxury"
        [(ngModel)]="prices.luxury"
        min="0"
        step="0.01"
        required
      />
    </div>

    <div class="actions">
      <button>
        Reset
      </button>
      <button type="submit" [disabled]="priceForm.invalid">
        Save changes
      </button>
    </div>

  </form>
</div>
