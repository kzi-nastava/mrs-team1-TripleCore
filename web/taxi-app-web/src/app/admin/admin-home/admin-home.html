<div class="admin-home-container">
  <app-navbar>
    <li class="nav-item">
      <a class="nav-link img-and-link" routerLink="/admin-ride-history">
        Ride history
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link img-and-link selected-nav-link" routerLink="/admin-home">
        Dashboard
      </a>
    </li>

    <li class="nav-item notifications-dropdown">
      <a class="nav-link img-and-link" style="cursor: pointer;" 
         (click)="toggleNotifications()">
          Notifications
        <span *ngIf="unreadPanicCount > 0" class="notification-badge">
          {{unreadPanicCount}}
        </span>
      </a>
      
      <!-- DROPDOWN CONTENT -->
      <div class="dropdown-content" *ngIf="showNotifications">
        <div class="dropdown-header">
          <h6>🚨 PANIC Alerts</h6>
          <small *ngIf="unreadPanicCount > 0" class="text-danger">
            {{unreadPanicCount}} new
          </small>
        </div>
        
        <div *ngIf="panicAlerts.length === 0" class="no-alerts">
          <p>No active panic alerts</p>
          <small>All clear! 🟢</small>
        </div>
        
        <div *ngFor="let alert of panicAlerts" class="alert-item">
          <div class="alert-content">
            <div class="alert-header">
              <div class="driver-name">Driver: {{alert.driverName}}</div>
              <div class="alert-time">{{alert.time | date:'HH:mm'}}</div>
            </div>
            <div class="passenger-info">Passenger: {{alert.passengerName}}</div>
            <button class="view-btn" (click)="viewDetails(alert.id)">
              View Details
            </button>
          </div>
        </div>
        
        <div class="dropdown-footer">
          <a routerLink="/admin/panic-notifications" (click)="showNotifications = false">
            See all notifications →
          </a>
        </div>
      </div>
    </li>

    <a class="nav-link img-and-link" routerLink="/user-info" matTooltip="My Profile">
      <img src="icons/icons8-test-account-48.png" class="nav-item-icon">
    </a>

    <li class="nav-item">
      <button class="nav-link nav-btn" (click)="logout()">Log out</button>
    </li>

    <a class="nav-link img-and-link" routerLink="/home" matTooltip="Live Chat">
      <img src="icons/icons8-chat-48.png" class="nav-item-icon">
    </a>
  </app-navbar>

  <app-map></app-map>
</div>
