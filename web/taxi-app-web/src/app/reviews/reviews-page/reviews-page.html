<div class="reviews-container">

  <div *ngIf="!reviews || reviews.length === 0" class="no-reviews">
    No reviews yet...
  </div>

  <div *ngIf="reviews.length > 0">
    <div class="review-card" *ngFor="let review of reviews">

      <div class="text-container">
        <div class="review-names">
          <span class="passenger-name"><i>{{ review.passengerName }}</i></span>
          <span class="arrow">  →  </span>
          <span class="driver-name"><i>{{ review.driverName }}</i></span>
        </div>
      </div>

      <div class="text-container ratings-container">

        <label>Driver rating</label>
        <div class="stars">
          <img
            *ngFor="let star of stars; let i = index"
            class="star"
            [src]="i < review.driverRating
              ? 'icons/star-full.png'
              : 'icons/star-empty.png'"
          />
        </div>

        <label>Vehicle rating</label>
        <div class="stars">
          <img
            *ngFor="let star of stars; let i = index"
            class="star"
            [src]="i < review.vehicleRating
              ? 'icons/star-full.png'
              : 'icons/star-empty.png'"
          />
        </div>
      </div>

      <p class="text-container">
        Comment:<br>
        <i>{{ review.comment }}</i>
      </p>

    </div>
  </div>

</div>
