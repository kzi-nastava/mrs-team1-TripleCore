<div class="overlay">
  <mat-card class="notification-card">
    <button class="close-btn" (click)="closeSelf()">×</button>
    <h2 class="title">{{ notification.title }}</h2>

    <mat-card-content>
        <pre>{{ notification.message }}</pre>
        <a
            *ngIf="link.length > 0"
            [routerLink]="link"
        >
            Follow link...
        </a>
    </mat-card-content>
  </mat-card>
</div>
