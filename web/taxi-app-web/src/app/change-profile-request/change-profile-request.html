  <app-navbar>
    <li class="nav-item">
      <a class="nav-link img-and-link" routerLink="/admin-ride-history">
        Ride history
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link img-and-link selected-nav-link" routerLink="/change-profile-request">
        Change Profile Requests
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link img-and-link" routerLink="/admin-home">
        Dashboard
      </a>
    </li>
  
  <li class="nav-item">
    <a class="nav-link img-and-link" routerLink="/register-driver">
      Register Driver
    </a>
  </li>

    <!-- Panic Notifications Component -->
    <app-panic-notifications
      [alerts]="panicAlerts"  
      [showDropdown]="showNotifications"
      [showResolved]="showResolvedAlerts"
      (toggleDropdown)="showNotifications = !showNotifications"
      (markAsResolved)="onMarkAsResolved($event)"
      (viewDetails)="onViewDetails($event)"
      (toggleResolvedView)="onToggleResolvedView($event)">
    </app-panic-notifications>

    <!-- Profile -->
    <a class="nav-link img-and-link" routerLink="/user-info" matTooltip="My Profile">
      <img src="icons/icons8-test-account-48.png" class="nav-item-icon">
    </a>

    <!-- Logout -->
    <li class="nav-item">
      <button class="nav-link nav-btn" (click)="onLogoutClick()">Log out</button>
    </li>

    <!-- Chat -->
    <button 
    class="nav-link img-and-link"  
    matTooltip="Live Chat"
    (click)="openChat()">
      <img src="icons/icons8-chat-48.png" class="nav-item-icon">
    </button>

    <app-admin-chat
      *ngIf="chatOpened"
      (close)="closeChat()">
    </app-admin-chat>
    
    <!-- Sound Toggle -->
    <li class="nav-item">
      <button class="nav-link img-and-link sound-toggle" 
              [class.muted]="isSoundMuted()"
              (click)="toggleSound()" 
              matTooltip="{{isSoundMuted() ? 'Sound OFF' : 'Sound ON'}}">
        {{isSoundMuted() ? '🔇' : '🔊'}}
      </button>
    </li>
  </app-navbar>

<div class="container page-content">
  <h2 class="text-center mb-5 profile-title">
    Profile Change Requests
  </h2>

  <div class="row justify-content-center d-flex gap-4">


    <div class="col-auto mb-4" *ngFor="let req of driverProfileChangeRequests">

      <div class="card request-card shadow-sm">


        <div class="card-header">
          <span class="driver-title">Driver</span> – 
          <span class="driver-email">{{ req.email }}</span>
        </div>

        <div class="card-body">
          <p class="created">Created: {{ req.createdAt | date:'dd.MM.yyyy' }}</p>
          <p>Status: 
            <span class="status-badge" [ngClass]="req.status.toLowerCase()">
              {{ req.status }}
            </span>
          </p>
        </div>

        <div class="card-footer">
          <button class="btn btn-primary review-btn" (click)="goToReviewPage(req.id)">Review request</button>
        </div>

      </div>
    </div>

    <div *ngIf="driverProfileChangeRequests.length === 0"
         class="text-center text-muted mt-5">
      No profile change requests.
    </div>

  </div>
</div>
